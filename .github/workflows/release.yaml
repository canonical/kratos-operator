name: release

on:
  workflow_dispatch:
  push:
    branches:
    - main
    - "track/**"

permissions:
    contents: write
    pull-requests: write

jobs:
  release:
      name: release
      uses: canonical/identity-team/.github/workflows/charm-release.yaml@1bf335af1d939c8543e53d376dd49d79126c2cd3 # v1.15.0
      secrets:
        PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
