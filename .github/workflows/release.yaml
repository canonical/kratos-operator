    - "track/**"

permissions:
    contents: write
    pull-requests: write

jobs:
  release:
      name: release
      uses: canonical/identity-team/.github/workflows/charm-release.yaml@6e3d618fb7650a26b7a2254a15fef1d28373bd9d # v1.17.1
      secrets:
        PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
