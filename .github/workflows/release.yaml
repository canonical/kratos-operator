  workflow_dispatch:
  push:
    branches:
    - main
    - "track/**"

permissions:
    contents: write
    pull-requests: write

jobs:
  release:
      name: release
      uses: canonical/identity-team/.github/workflows/charm-release.yaml@e710e7f451e62c37e7038d45b6c3bfa7dbfb28c0 # v1.20.0
      secrets:
