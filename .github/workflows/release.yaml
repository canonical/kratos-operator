    - "track/**"

permissions:
    contents: write
    pull-requests: write

jobs:
  release:
      name: release
      uses: canonical/identity-team/.github/workflows/charm-release.yaml@fc85af7448538c473be450dc2c8ec5d158ea0d15 # v1.17.0
      secrets:
        PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
