name: auto-approver
run-name: CI for approving PRs

on:
  push:
    branches:
      - "renovate/**"
      - "automated-update-charm-libs"

jobs:
  auto-approve:
    name: Auto-approve and merge pull request
    uses: canonical/identity-team/.github/workflows/pr-auto-approval.yaml@e710e7f451e62c37e7038d45b6c3bfa7dbfb28c0 # v1.20.0
    secrets:
      PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
