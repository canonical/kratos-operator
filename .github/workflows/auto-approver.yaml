name: auto-approver
run-name: CI for approving PRs

on:
  push:
    branches:
      - "renovate/**"
      - "automated-update-charm-libs"

jobs:
  auto-approve:
    name: Auto-approve and merge pull request
    uses: canonical/identity-team/.github/workflows/pr-auto-approval.yaml@9bbee2e8d44fe72c7e6733d132ea63e844943133 # v1.17.2
    secrets:
      PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
