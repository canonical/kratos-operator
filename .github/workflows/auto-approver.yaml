name: auto-approver
run-name: CI for approving PRs

on:
  push:
    branches:
      - "renovate/**"
      - "automated-update-charm-libs"

jobs:
  auto-approve:
    name: Auto-approve and merge pull request
    uses: canonical/identity-team/.github/workflows/pr-auto-approval.yaml@00995831ff788db43992012900820edf7967305f # v1.19.2
    secrets:
      PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
