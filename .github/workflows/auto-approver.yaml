name: auto-approver
run-name: CI for approving PRs

on:
  push:
    branches:
      - "renovate/**"
      - "automated-update-charm-libs"

jobs:
  auto-approve:
    name: Auto-approve and merge pull request
    uses: canonical/identity-team/.github/workflows/pr-auto-approval.yaml@fc85af7448538c473be450dc2c8ec5d158ea0d15 # v1.17.0
    secrets:
      PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
