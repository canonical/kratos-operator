name: auto-approver
run-name: CI for approving PRs

on:
  push:
    branches:
      - "renovate/**"
      - "automated-update-charm-libs"

jobs:
  auto-approve:
    name: Auto-approve and merge pull request
    uses: canonical/identity-team/.github/workflows/pr-auto-approval.yaml@6e3d618fb7650a26b7a2254a15fef1d28373bd9d # v1.17.1
    secrets:
      PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
