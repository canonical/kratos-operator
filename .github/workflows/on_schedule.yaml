name: On Schedule
on:
  schedule:
    - cron: '0 8 * * MON'

jobs:
  update-charm-libs:
    name: Update Charm Libraries
    uses: canonical/identity-team/.github/workflows/charm-libs-update.yaml@6e3d618fb7650a26b7a2254a15fef1d28373bd9d # v1.17.1
    secrets:
      CHARMCRAFT_CREDENTIALS: ${{ secrets.CHARMCRAFT_CREDENTIALS }}
      PAT_TOKEN: ${{ secrets.PAT_TOKEN }}

  tests:
    name: CI
    uses: canonical/identity-team/.github/workflows/charm-pull-request.yaml@6e3d618fb7650a26b7a2254a15fef1d28373bd9d # v1.17.1
    with:
      container-name: "kratos"
      use-charmcraftcache: false
