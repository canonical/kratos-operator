name: On Schedule
on:
  schedule:
    - cron: '0 8 * * MON'

jobs:
  update-charm-libs:
    name: Update Charm Libraries
    uses: canonical/identity-team/.github/workflows/charm-libs-update.yaml@e710e7f451e62c37e7038d45b6c3bfa7dbfb28c0 # v1.20.0
    secrets:
      CHARMCRAFT_CREDENTIALS: ${{ secrets.CHARMCRAFT_CREDENTIALS }}
      PAT_TOKEN: ${{ secrets.PAT_TOKEN }}

  tests:
    name: CI
    uses: canonical/identity-team/.github/workflows/charm-pull-request.yaml@e710e7f451e62c37e7038d45b6c3bfa7dbfb28c0 # v1.20.0
    with:
      container-name: "kratos"
      use-charmcraftcache: false
