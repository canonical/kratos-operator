name: On Schedule
on:
  schedule:
    - cron: '0 8 * * MON'

jobs:
  update-charm-libs:
    name: Update Charm Libraries
    uses: canonical/identity-team/.github/workflows/charm-libs-update.yaml@e017941885bd1d17774bf7be2cbbb1d1abe80d9e # v1.16.0
    secrets:
      CHARMCRAFT_CREDENTIALS: ${{ secrets.CHARMCRAFT_CREDENTIALS }}
      PAT_TOKEN: ${{ secrets.PAT_TOKEN }}

  tests:
    name: CI
    uses: canonical/identity-team/.github/workflows/charm-pull-request.yaml@e017941885bd1d17774bf7be2cbbb1d1abe80d9e # v1.16.0
    with:
      container-name: "kratos"
      use-charmcraftcache: false
