name: ci
run-name: CI for ${{ github.sha }} on ${{ github.ref_name }}

on:
   workflow_dispatch:
   push:
     branches:
     - "main"
     - "release-**"
     - "track/**"
     paths-ignore:
     - "terraform/**"
   pull_request:
     branches:
     - "*"
     paths-ignore:
     - "terraform/**"

jobs:
  tests:
    name: CI
    uses: canonical/identity-team/.github/workflows/charm-pull-request.yaml@IAM-1424-canonical-k8s  # WIP
    with:
      container-name: "kratos"
      use-charmcraftcache: false
      node-size: large
      k8s-distribution: "k8s"
      juju-channels: '["3.6/stable", "4.0/stable"]'
