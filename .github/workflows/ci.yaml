name: ci
run-name: CI for ${{ github.sha }} on ${{ github.ref_name }}

on:
   workflow_dispatch:
   push:
     branches:
     - "main"
     - "release-**"
     - "track/**"
     paths-ignore:
     - "terraform/**"
   pull_request:
     branches:
     - "*"
     paths-ignore:
     - "terraform/**"

jobs:
  tests:
    name: CI
    if: github.event_name != 'pull_request' || github.head_ref != 'release-please--branches--main'
    uses: canonical/identity-team/.github/workflows/charm-pull-request.yaml@IAM-2282-support-multiple-bases
    with:
      container-name: "kratos"
      use-charmcraftcache: false
      node-size: large
      base: "26.04"
      k8s-channel: "1.35-strict/stable"
